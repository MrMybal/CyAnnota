appId: com.cyberalien.cyannota
productName: CyAnnota
electronVersion: 44.0.0
electronDist: ../node_modules/electron/dist
asar: true
npmRebuild: false
compression: maximum

directories:
  output: ../release

files:
  - main.cjs
  - preload.cjs
  - dist/renderer/**/*

extraResources:
  - from: ../LICENSE
    to: legal/LICENSE-CyAnnota.txt
  - from: ../THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: ../licenses
    to: legal/licenses

win:
  icon: ../public/cyannota-logo.png
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: CyAnnota-${version}-portable.${ext}

nsis:
  artifactName: CyAnnota-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

fileAssociations:
  - ext: cyannota
    name: Projet CyAnnota
    description: Projet image ou vidéo annoté avec CyAnnota
    role: Editor
    mimeType: application/x-cyannota

protocols:
  - name: Intégration CyAnnota
    schemes:
      - cyannota
